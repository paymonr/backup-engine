name: ci
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: shellcheck scripts/*.sh scripts/lib/*.sh setup.sh
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bats-core/bats-action@3.0.0
      - run: bats tests/bats/
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update && sudo apt-get install -y restic
          # awscli is not an apt package on the runner (Ubuntu 24.04); use the official v2 installer
          curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
          unzip -q /tmp/awscliv2.zip -d /tmp
          sudo /tmp/aws/install --update
          curl -fsSL https://downloads.rclone.org/rclone-current-linux-amd64.zip -o /tmp/r.zip
          sudo unzip -j /tmp/r.zip '*/rclone' -d /usr/local/bin
          curl -fsSL https://dl.min.io/server/minio/release/linux-amd64/minio -o /tmp/minio
          sudo install -m0755 /tmp/minio /usr/local/bin/minio
      - uses: bats-core/bats-action@3.0.0
      - run: bats tests/integration/
  tofu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
      - run: cd opentofu && tofu fmt -check && tofu init -backend=false && tofu validate
  estimator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pytest
      - run: python -m pytest tests/estimator/ -v
  gui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install flask waitress pytest
      - run: python -m pytest tests/gui/ -v
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t backup-engine:ci .
      - name: compose smoke run (best-effort; MinIO readiness can race)
        run: |
          docker compose -f docker-compose.test.yml up --build --abort-on-container-exit --exit-code-from backup-engine || true
          docker compose -f docker-compose.test.yml logs backup-engine
