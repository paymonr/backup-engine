{# app/gui/templates/error.html — the one themed error page (spec 5.14). #}
{% extends "base.html" %}
{% block title %}Error {{ code }} — backup-engine{% endblock %}
{% block body %}
<section class="read screen">
  <p class="eyebrow">Error {{ code }}</p>
  <h1>{{ title }}</h1>
  <p class="lead" style="margin-top:var(--sp-3)">{{ lead }}</p>
  <p style="margin-top:var(--sp-6)">
    <a class="btn btn-primary" href="{{ url_for('gui.index') }}">Back to the Board</a>
  </p>
</section>
{% endblock %}
