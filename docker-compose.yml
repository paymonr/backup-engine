services:
  backup-engine:
    image: ghcr.io/paymonr/backup-engine:latest
    container_name: backup-engine
    restart: unless-stopped
    volumes:
      - /mnt/user:/backup/media:ro   # SOURCE_ROOT; parent of everything you might back up — create jobs in the GUI
      - ./config:/config
      - ./cache:/cache
    ports:
      - "8099:8099"   # GUI (Phase 2)
