services:
  backup-engine:
    image: ghcr.io/paymonr/backup-engine:latest
    container_name: backup-engine
    restart: unless-stopped
    volumes:
      - /mnt/appdata_system/appdata_backups:/backup/appdata:ro
      - /mnt/user:/backup/media:ro   # parent of your shares; pick which to back up in the GUI
      - ./config:/config
      - ./cache:/cache
    ports:
      - "8099:8099"   # GUI (Phase 2)
