services:
  minio:
    image: quay.io/minio/minio
    command: server /data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000"]
  usb:
    build: .
    depends_on: [minio]
    environment:
      RUN_ONCE: appdata
      CONFIG_DIR: /config
    volumes:
      - ./tests/fixtures/config:/config
      - ./tests/fixtures/appdata:/backup/appdata:ro
      - usb-cache:/cache
volumes:
  usb-cache:
